<div>
  <h2>Brackets</h2>
  <ul>
    <li *ngFor="let bracket of brackets">
      {{ bracket.bracketType }} - {{ bracket.tournament?.name }}
      <button (click)="deleteBracket(bracket.id)">Delete</button>
    </li>
  </ul>

  <h3>Add Bracket</h3>
  <form (ngSubmit)="addBracket()">
    <label for="bracketType">Bracket Type:</label>
    <select [(ngModel)]="newBracket.bracketType" name="bracketType">
      <option *ngFor="let type of BracketType | keyvalue" [value]="type.key">{{ type.key }}</option>
    </select>

    <label for="tournament">Tournament:</label>
    <input [(ngModel)]="newBracket.tournament!.name" name="tournament" type="text">

    <button type="submit">Add Bracket</button>
  </form>
</div>
