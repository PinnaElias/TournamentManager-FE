<div class="container-fluid">
  <form class="d-flex m-3" role="search" (submit)="onSearch($event)">
    <input [(ngModel)]="searchTerm" name="search" class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
    <button class="btn btn-outline-success" type="submit">Search</button>
  </form>

  <div *ngFor="let tournament of filteredTournaments" class="mt-4 d-flex justify-content-center">
    <div class="card p-5 shadow-sm mb-3" style="width: 100%; max-width: 900px;">
      <img *ngIf="tournament.avatar" [src]="tournament.avatar" class="card-img-top" alt="Tournament Image">
      <div class="card-body text-center">
        <h2 class="card-title text-light">{{tournament.name}} - {{tournament.game?.name}}</h2>
        <h4 class="card-text text-light">{{tournament.description}}</h4>
        <h4 class="card-text text-light">
          <small class="text-success">{{tournament.startingDate}} - {{tournament.h4rize}}</small>
        </h4>
      </div>
    </div>
  </div>
</div>
