<div class="container mt-5">
  <!-- Sezione di Creazione del Torneo -->
  <div class="container d-flex justify-content-center align-items-center">
    <h1 class="mb-4 text-light">Create Tournament</h1>
  </div>

  <!-- Form per la creazione del torneo -->
  <form [formGroup]="tournamentForm" (ngSubmit)="onSubmit()" class="bg-light p-4 rounded shadow-sm">
    <div class="form-group mb-3">
      <label for="name" class="form-label">Nome del Torneo</label>
      <input type="text" id="name" formControlName="name" class="form-control"
        placeholder="Inserisci il nome del torneo" required>
      <div *ngIf="tournamentForm.get('name')?.invalid && tournamentForm.get('name')?.touched" class="text-danger">
        Il nome del torneo è obbligatorio.
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="avatar" class="form-label">Avatar del Torneo (URL)</label>
      <input type="text" id="avatar" formControlName="avatar" class="form-control"
        placeholder="Inserisci l'URL dell'avatar">
    </div>

    <div class="form-group mb-3">
      <label for="description" class="form-label">Descrizione</label>
      <textarea id="description" formControlName="description" class="form-control"
        placeholder="Inserisci una descrizione"></textarea>
    </div>

    <div class="form-group mb-3">
      <label for="bracketType" class="form-label">Tipo di Bracket</label>
      <select id="bracketType" formControlName="bracketType" (change)="onBracketTypeChange($event)" class="form-select"
        required>
        <option value="" disabled selected>Seleziona il formato del torneo</option>
        <option *ngFor="let type of bracketTypes" [value]="type">{{ type }}</option>
      </select>
    </div>

    <div *ngIf="tournamentForm.get('bracketType')?.value" class="form-group mb-3">
      <label for="teams" class="form-label">Seleziona le Squadre</label>
      <select id="teams" formControlName="teams" class="form-select" multiple>
        <option *ngFor="let team of availableTeams" [value]="team.id">{{ team.name }}</option>
      </select>
    </div>

    <div class="form-group mb-3">
      <label for="startingDate" class="form-label">Data di Inizio</label>
      <input type="date" id="startingDate" formControlName="startingDate" class="form-control">
    </div>

    <div class="form-group mb-3">
      <label for="endingDate" class="form-label">Data di Fine</label>
      <input type="date" id="endingDate" formControlName="endingDate" class="form-control">
    </div>

    <div class="form-group mb-3">
      <label for="startingTime" class="form-label">Orario di Inizio</label>
      <input type="time" id="startingTime" formControlName="startingTime" class="form-control">
    </div>

    <div class="form-group mb-3">
      <label for="prize" class="form-label">Premio</label>
      <input type="text" id="prize" formControlName="prize" class="form-control" placeholder="Inserisci il premio">
    </div>

    <button type="submit" class="btn btn-success" [disabled]="!tournamentForm.valid">Crea Torneo</button>
  </form>

  <!-- Modal per la selezione del bracket -->
  <div class="modal fade" id="bracketModal" tabindex="-1" aria-labelledby="bracketModalLabel" aria-hidden="true" #bracketModal>
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="bracketModalLabel">Seleziona il Bracket</h5>
          <button type="button" class="btn-close" (click)="hideBracketModal()" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form [formGroup]="bracketForm" (ngSubmit)="onBracketSubmit()">
            <div class="form-group mb-3">
              <label for="bracketType" class="form-label">Tipo di Bracket</label>
              <select id="bracketType" formControlName="bracketType" class="form-select"
                (change)="onBracketTypeChange($event)">
                <option value="" disabled selected>Seleziona il tipo di bracket</option>
                <option *ngFor="let type of bracketTypes" [value]="type">{{ type }}</option>
              </select>
            </div>

            <div class="form-group mb-3">
              <label for="participants" class="form-label">Partecipanti</label>
              <select id="participants" formControlName="participants" class="form-select" multiple>
                <option *ngFor="let team of availableTeams" [value]="team.id">{{ team.name }}</option>
              </select>
            </div>
            <button type="submit" class="btn btn-outline-success me-2">Crea Bracket</button>
            <button type="button" class="btn btn-outline-danger mx-2" (click)="hideBracketModal()">Chiudi</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
