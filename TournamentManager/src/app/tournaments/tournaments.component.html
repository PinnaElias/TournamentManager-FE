<!-- src/app/components/tournament/tournament.component.html -->

<div class="tournament-container">
  <h1>Tournaments</h1>
  <div *ngFor="let tournament of tournaments">
    <div class="tournament-card">
      <h2>{{ tournament.name }}</h2>
      <p>{{ tournament.description }}</p>
      <p>Game: {{ tournament.game.name }}</p>
      <p>Starting Date: {{ tournament.startingDate | date:'shortDate' }}</p>
      <p>Ending Date: {{ tournament.endingDate | date:'shortDate' }}</p>
      <button (click)="viewBracket(tournament.id)">View Bracket</button>
      <button (click)="openEditTournamentModal(tournament.id)">Edit</button>
      <button (click)="deleteTournament(tournament.id)">Delete</button>
    </div>
  </div>
  <button (click)="openCreateTournamentModal()">Create Tournament</button>

  <!-- Create Tournament Modal -->
  <div class="modal" [ngClass]="{'show': isCreateModalOpen}" id="createTournamentModal">
    <div class="modal-content">
      <h2>Create Tournament</h2>
      <form (ngSubmit)="createTournament(createTournamentForm.value)" #createTournamentForm="ngForm">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" ngModel placeholder="Name" required />

        <label for="description">Description</label>
        <input type="text" id="description" name="description" ngModel placeholder="Description" required />

        <label for="game">Game</label>
        <select id="game" name="game" ngModel #game="ngModel" required>
          <option *ngFor="let game of games" [ngValue]="game">{{ game.name }}</option>
        </select>

        <label for="startingDate">Starting Date</label>
        <input type="date" id="startingDate" name="startingDate" ngModel placeholder="Starting Date" required />

        <label for="endingDate">Ending Date</label>
        <input type="date" id="endingDate" name="endingDate" ngModel placeholder="Ending Date" required />

        <button type="submit">Create</button>
        <button type="button" (click)="closeCreateTournamentModal()">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Edit Tournament Modal -->
  <div class="modal" [ngClass]="{'show': isEditModalOpen}" id="editTournamentModal">
    <div class="modal-content">
      <h2>Edit Tournament</h2>
      <form (ngSubmit)="updateTournament()" #editTournamentForm="ngForm">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" [(ngModel)]="editTournament!.name" />

        <label for="description">Description</label>
        <input type="text" id="description" name="description" [(ngModel)]="editTournament!.description" />

        <label for="game">Game</label>
        <select id="game" name="game" [(ngModel)]="editTournament!.game">
          <option *ngFor="let game of games" [ngValue]="game">{{ game.name }}</option>
        </select>

        <label for="startingDate">Starting Date</label>
        <input type="date" id="startingDate" name="startingDate" [(ngModel)]="editTournament!.startingDate" />

        <label for="endingDate">Ending Date</label>
        <input type="date" id="endingDate" name="endingDate" [(ngModel)]="editTournament!.endingDate" />

        <button type="submit">Update</button>
        <button type="button" (click)="closeEditTournamentModal()">Cancel</button>
      </form>
    </div>
  </div>
</div>
